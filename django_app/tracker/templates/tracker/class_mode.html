{% extends "base.html" %}
{% block content %}
<a class="crumb" href="{% url 'tracker:home' %}">Other classes</a>
<div class="page-head">
  <div>
    <p class="eyebrow">Tap a name to add materials</p>
    <h1>{{ class_label }}</h1>
  </div>
  <a role="button" class="ghost" href="{% url 'tracker:sale_new' %}?class_name={{ class_name|urlencode }}">Record a sale</a>
</div>
<div class="tile-grid">
  {% for s in students %}
    <a class="tile student-tile" href="{% url 'tracker:class_basket' s.pk %}">
      <span class="avatar small" aria-hidden="true">{{ s.name|slice:":1"|upper }}</span>
      <span class="tile-name">{{ s.name }}</span>
    </a>
  {% empty %}
    <p class="empty">No students in this class yet.</p>
  {% endfor %}
</div>
{% endblock %}
