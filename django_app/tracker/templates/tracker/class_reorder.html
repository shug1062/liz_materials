{% extends "base.html" %}
{% block content %}
<a class="crumb" href="{% url 'tracker:student_list' %}">← Students</a>
<div class="page-head">
  <div>
    <p class="eyebrow">Arrange</p>
    <h1>Class order</h1>
    <p class="lede">Drag classes into the order you want them on the dashboard and students page. Changes save automatically.</p>
  </div>
  <div id="save-status" aria-live="polite"></div>
</div>
<section class="panel narrow-panel">
  <form data-sortable class="sortable-list" hx-post="{% url 'tracker:class_reorder' %}" hx-trigger="end" hx-target="#save-status">
    {% for name in class_names %}
      <div class="sortable-item"><span class="handle" aria-hidden="true">⠿</span><span class="gem"></span>{{ name }}<input type="hidden" name="class_name" value="{{ name }}"></div>
    {% empty %}
      <p class="empty">No classes yet.</p>
    {% endfor %}
  </form>
</section>
{% endblock %}
