{% extends "base.html" %}
{% block content %}
<div class="page-head">
  <div>
    <p class="eyebrow">Accounts</p>
    <h1>Payments</h1>
  </div>
  <div class="btn-row">
    <a role="button" class="ghost" href="{% url 'tracker:sale_new' %}?next={{ request.get_full_path|urlencode }}">Record a sale</a>
    <a role="button" href="{% url 'tracker:payment_new' %}">Record payment</a>
  </div>
</div>
<section class="panel">
  <div class="body">
    <form hx-get="{% url 'tracker:payments_report' %}" hx-target="#payments" hx-trigger="change" hx-push-url="true">
      <div class="filters">
        <label>Show {{ form.group }}</label>
        <label>Student {{ form.student }}</label>
        <label>From {{ form.start }}</label>
        <label>To {{ form.end }}</label>
      </div>
      <noscript><button type="submit">Apply</button></noscript>
    </form>
    <div class="btn-row">
      <a href="{% url 'tracker:payments_report' %}" class="small">This tax year ({{ tax_year }})</a>
      <a href="{% url 'tracker:payments_report' %}?all=1" class="small">Show all payments</a>
      <a href="{% url 'tracker:sale_list' %}" class="small">One-off sales are on the Sales page →</a>
    </div>
  </div>
</section>
<div id="payments">{% include "tracker/partials/payments_table.html" %}</div>
{% endblock %}
