{% extends "base.html" %}
{% block content %}
<div class="page-head">
  <div>
    <p class="eyebrow">Class register</p>
    <h1>Choose a class</h1>
  </div>
</div>
<div class="tile-grid">
  {% for value, label, count in classes %}
    <a class="tile class-tile" href="{% url 'tracker:class_mode' %}?class_name={{ value|urlencode }}">
      <span class="tile-name">{{ label }}</span>
      <span class="unit">{{ count }} student{{ count|pluralize }}</span>
    </a>
  {% empty %}
    <p class="empty">No classes yet.</p>
  {% endfor %}
</div>
{% endblock %}
