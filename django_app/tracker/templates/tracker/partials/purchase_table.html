{% load money %}
<figure>
<table>
  <thead>
    <tr>
      <th>Date</th>{% if show_student %}<th>Student</th>{% endif %}<th>Material</th>
      <th class="num">Qty</th><th class="num">Unit price</th><th class="num">Total</th><th>Project</th><th></th>
    </tr>
  </thead>
  <tbody>
  {% for p in purchases %}
    <tr>
      <td class="nowrap">{{ p.purchase_date|date:"j M Y" }}</td>
      {% if show_student %}<td><a href="{{ p.student.get_absolute_url }}">{{ p.student }}</a></td>{% endif %}
      <td>{{ p.material }}{% if p.notes %}<span class="sub-text">{{ p.notes }}</span>{% endif %}</td>
      <td class="num">{{ p.quantity|floatformat:"-2" }} <span class="unit">{{ p.material.unit_type }}</span></td>
      <td class="num">{{ p.unit_price|gbp }}</td>
      <td class="num"><strong>{{ p.total_cost|gbp }}</strong></td>
      <td>{{ p.project|default:"–" }}</td>
      <td>
        <div class="actions">
          <a class="small ghost" role="button" href="{% url 'tracker:purchase_edit' p.pk %}?next={{ request.get_full_path|urlencode }}">Edit</a>
          <button class="small danger-ghost" hx-post="{% url 'tracker:purchase_delete' p.pk %}">Delete</button>
        </div>
      </td>
    </tr>
  {% empty %}
    <tr><td colspan="8" class="empty">No purchases yet.</td></tr>
  {% endfor %}
  </tbody>
</table>
</figure>
